<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorama: Empareja objetos cotidianos en chino</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --lego-red: #D6180E;
    --lego-red-dark: #9E0F08;
    --lego-yellow: #FFD500;
    --lego-yellow-dark: #E0AF00;
    --lego-blue: #0060B0;
    --lego-blue-dark: #003E75;
    --lego-green: #00A650;
    --lego-green-dark: #00793B;
    --ink: #1A1A1A;
    --white: #FFFFFF;
    --plate: #ECEEF1;
    --paper: #FFFDF7;
  }

  *{box-sizing:border-box;}

  body{
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    text-align: center;
    background:
      radial-gradient(circle at 17px 17px, rgba(0,0,0,0.07) 4px, transparent 4.5px),
      linear-gradient(180deg, #EEF1F5 0%, #DEE3EA 100%);
    background-size: 34px 34px, 100% 100%;
    background-attachment: fixed;
    color: var(--ink);
    padding: 14px 16px 24px;
    margin: 0;
    min-height: 100vh;
  }

  h1, h2, h3 { font-family: 'Baloo 2', 'Noto Serif TC', sans-serif; margin: 0; font-weight: 800; }

  /* ---------- 樂高積木標題 ---------- */
  .title-banner{
    display:inline-flex;
    align-items:center;
    background: var(--lego-red);
    color: var(--white);
    padding: 12px 30px 14px;
    border: 4px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 7px 0 var(--lego-red-dark), 0 7px 0 4px var(--ink), 0 12px 18px rgba(0,0,0,0.22);
    position: relative;
    margin: 10px 0 22px;
  }
  .title-banner::before{
    content:'';
    position:absolute;
    top:-13px; left:50%;
    transform: translateX(-50%);
    width: 66%;
    min-width: 120px;
    height: 15px;
    background-image: radial-gradient(circle, var(--lego-red) 0 38%, var(--ink) 39% 44%, transparent 45%);
    background-size: 30px 30px;
    background-position: center;
    background-repeat: repeat-x;
  }
  .title-banner h1{
    font-size: 1.7rem;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 var(--lego-red-dark);
  }
  .subtitle{
    margin: 0 0 18px;
    color: var(--lego-blue-dark);
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 1px;
  }
  /* 遊戲中縮小標題，把空間讓給牌 */
  body.in-game .title-banner{ padding: 6px 20px 8px; margin: 8px 0 12px; }
  body.in-game .title-banner h1{ font-size: 1.25rem; }
  body.in-game .subtitle{ display:none; }

  /* ================= 設定（字體／語言／發音標示） ================= */
  .setting-group{ display:flex; flex-direction:column; gap:6px; text-align:left; }
  .setting-label{ font-size: 0.82rem; font-weight: 700; color: var(--lego-blue-dark); letter-spacing: .5px; }
  .seg{
    display:flex;
    border: 3px solid var(--ink);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  .seg button{
    flex: 1;
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    padding: 6px 4px;
    border: 0;
    border-left: 2px solid var(--ink);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    min-height: 38px;
  }
  .seg button:first-child{ border-left: 0; }
  .seg button.active{ background: var(--lego-yellow); }
  .settings-block{ display:flex; flex-direction:column; gap: 12px; }

  /* ================= 姓名輸入畫面 ================= */
  #name-screen{
    max-width: 440px;
    margin: 30px auto 0;
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 20px;
    padding: 34px 28px 30px;
    box-shadow: 0 8px 0 var(--ink), 0 16px 26px rgba(0,0,0,0.18);
  }
  .seal{
    width: 66px; height: 66px;
    margin: 0 auto 14px;
    background: var(--lego-yellow);
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Noto Serif TC', serif;
    font-size: 1.6rem;
    font-weight: 900;
    box-shadow: 0 5px 0 var(--lego-yellow-dark);
  }
  #name-screen p.desc{
    color: #4a4a4a;
    font-size: 0.92rem;
    line-height: 1.7;
    margin: 10px 0 18px;
    font-weight: 500;
  }
  #name-screen .settings-block{ margin: 0 0 18px; }
  #player-name{
    width: 100%;
    padding: 12px 16px;
    font-size: 1.05rem;
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    font-weight: 600;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    outline: none;
    text-align: center;
  }
  #player-name:focus{ border-color: var(--lego-blue); }

  .btn{
    font-family: 'Baloo 2', 'Noto Serif TC', sans-serif;
    padding: 13px 32px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    background: var(--lego-yellow);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 12px;
    box-shadow: 0 6px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover{ background: var(--lego-yellow-dark); }
  .btn:active{ transform: translateY(6px); box-shadow: 0 0 0 var(--ink); }
  .btn.ghost{
    background: var(--white);
    color: var(--lego-blue-dark);
    border: 3px solid var(--lego-blue-dark);
    box-shadow: 0 6px 0 var(--lego-blue-dark);
    padding: 11px 26px;
  }
  .btn.ghost:active{ transform: translateY(6px); box-shadow: 0 0 0 var(--lego-blue-dark); }

  #name-screen .btn{ margin-top: 18px; width: 100%; }
  #name-error{
    color: var(--lego-red);
    font-weight: 700;
    font-size: 0.82rem;
    min-height: 18px;
    margin-top: 8px;
  }

  /* ================= 遊戲畫面（寬螢幕：三欄） ================= */
  #game-screen{ display:none; }

  .game-layout{
    display: flex;
    gap: 22px;
    max-width: 1180px;
    margin: 0 auto;
    align-items: flex-start;
    justify-content: center;
  }
  .board-col{
    flex: 1 1 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    order: 2;
  }
  .panel{
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 18px;
    box-shadow: 0 7px 0 var(--ink), 0 12px 20px rgba(0,0,0,0.14);
  }
  .sidebar-col{
    flex: 0 0 250px;
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    text-align: left;
    order: 3;
  }
  .log-col{
    flex: 0 0 240px;
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
    order: 1;
    max-height: 560px;
  }
  .log-col h3{ font-size: 1rem; font-weight: 700; color: var(--lego-red); margin: 0; }
  .log-list{
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .log-list li{
    font-size: 0.8rem;
    line-height: 1.5;
    padding: 7px 9px;
    border-radius: 8px;
    background: var(--plate);
    border: 2px solid #d3d6db;
    color: #4a4a4a;
    font-weight: 500;
    word-break: break-word;
  }
  .log-list li.log-success{
    background: #e2f7ea;
    border-color: var(--lego-green);
    color: var(--lego-green-dark);
    font-weight: 700;
  }
  .log-list li .zh{ font-family: 'Noto Sans TC', sans-serif; font-weight: 700; color: var(--ink); }
  .log-empty{ font-size: 0.82rem; color: #9a9a9a; }
  .sidebar-divider{
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 8px, transparent 8px 14px);
    opacity: 0.25;
    border-radius: 2px;
  }

  .player-chip{
    font-family: 'Baloo 2', 'Noto Serif TC', serif;
    background: var(--lego-blue);
    color: var(--white);
    padding: 8px 16px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    align-self: flex-start;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stats{
    display:flex;
    flex-direction: column;
    gap: 8px;
    font-size: 0.98rem;
    font-weight: 600;
  }
  .stats b{ color: var(--lego-red); }
  .sidebar-col .btn{ width: 100%; }
  .bar-buttons{ display:flex; flex-direction:column; gap: 14px; }
  #settings-toggle-btn{ display:none; }
  #voice-hint{
    display:none;
    font-size: 0.78rem;
    line-height: 1.45;
    font-weight: 600;
    color: #7a5a00;
    background: #fff4c2;
    border: 2px solid var(--lego-yellow-dark);
    border-radius: 8px;
    padding: 7px 9px;
    text-align: left;
  }
  #voice-hint.show{ display:flex; gap:6px; align-items:flex-start; }
  #voice-hint .hint-text{ flex:1; }
  #voice-hint .hint-close{
    border:0; background:transparent; font-size:1rem; font-weight:900; line-height:1;
    cursor:pointer; color:#7a5a00; padding:0 2px;
  }
  @media (max-width: 1150px){
    #voice-hint{ font-size: 0.72rem; padding: 5px 8px; line-height: 1.35; }
  }

  /* 最近翻牌（只在窄螢幕顯示） */
  .last-flip{ display:none; }

  /* ================= 窄螢幕（手機、平板）：上方狀態列 + 牌 + 紀錄 ================= */
  @media (max-width: 1150px){
    body{ padding: 8px 8px 20px; }
    body.in-game .title-banner{ display:none; }
    .game-layout{ flex-direction: column; align-items: stretch; gap: 10px; }
    .sidebar-col{
      order: 1;
      flex: none;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 8px 10px;
      gap: 8px;
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--ink);
    }
    .sidebar-col .player-chip, .sidebar-col .sidebar-divider{ display:none; }
    .stats{
      flex-direction: row;
      justify-content: space-around;
      font-size: 0.95rem;
      gap: 6px;
    }
    .bar-buttons{ flex-direction: row; gap: 8px; }
    .bar-buttons .btn{
      flex: 1;
      padding: 6px 4px;
      font-size: 0.85rem;
      letter-spacing: 0;
      border-radius: 10px;
      box-shadow: 0 4px 0 var(--ink);
    }
    .bar-buttons .btn.ghost{ box-shadow: 0 4px 0 var(--lego-blue-dark); }
    #settings-toggle-btn{ display:block; }
    .sidebar-col .settings-block{ display:none; padding: 4px 2px 6px; }
    .sidebar-col.open .settings-block{ display:flex; }
    .board-col{ order: 2; flex: none; }
    .last-flip{
      display:block;
      width: 100%;
      max-width: 700px;
      margin: 10px auto 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4a4a4a;
      min-height: 1.5em;
    }
    .last-flip .zh{ font-family:'Noto Sans TC', sans-serif; font-weight:700; color: var(--ink); }
    .log-col{
      order: 3;
      flex: none;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      max-height: none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--ink);
    }
    .log-col h3{ cursor: pointer; user-select: none; }
    .log-col h3::after{ content: ' ▸'; }
    .log-col.open h3::after{ content: ' ▾'; }
    .log-col .log-list{ display:none; max-height: 240px; }
    .log-col.open .log-list{ display:flex; }
  }

  /* ================= 牌面 ================= */
  .game-board{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }
  @media (max-width: 1150px){
    /* 讓 6 排牌盡量一個畫面放得下 */
    .game-board{ max-width: min(700px, calc(100dvh - 150px)); gap: 6px; }
  }
  @media (max-width: 420px){
    .game-board{ gap: 4px; }
  }

  .card{
    aspect-ratio: 1 / 1;
    perspective: 1000px;
    cursor: pointer;
    position: relative;
    container-type: inline-size;
    -webkit-tap-highlight-color: transparent;
  }
  .firework{ position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 6; }
  .firework span{
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    transform: translate(-50%, -50%);
    animation: fw-burst 0.7s ease-out forwards;
  }
  @keyframes fw-burst{
    0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3) rotate(90deg); opacity: 0; }
  }
  .card-inner{
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
    position: relative;
  }
  .card.flipped .card-inner, .card.matched .card-inner{ transform: rotateY(180deg); }
  .card.shake{ animation: shakeCard 0.45s; }
  @keyframes shakeCard{
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .card-front, .card-back{
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 3px solid var(--ink);
    overflow: hidden;
  }
  /* 卡背：樂高積木上蓋 */
  .card-front{
    background: linear-gradient(155deg, var(--brick-color, var(--lego-red)) 0%, var(--brick-color-dark, var(--lego-red-dark)) 100%);
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.35), inset 0 -7px 0 rgba(0,0,0,0.22);
  }
  .card-front::before{
    content:'';
    position:absolute;
    inset: 0;
    --stud: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.15) 45%, rgba(0,0,0,0.15) 60%, transparent 68%);
    background-image: var(--stud), var(--stud), var(--stud), var(--stud);
    background-size: 34% 34%;
    background-position: 26% 26%, 74% 26%, 26% 74%, 74% 74%;
    background-repeat: no-repeat;
    opacity: 0.9;
  }
  .card:nth-child(8n+1) .card-front, .card:nth-child(8n+6) .card-front{ --brick-color: var(--lego-red); --brick-color-dark: var(--lego-red-dark); }
  .card:nth-child(8n+2) .card-front, .card:nth-child(8n+8) .card-front{ --brick-color: var(--lego-yellow); --brick-color-dark: var(--lego-yellow-dark); }
  .card:nth-child(8n+3) .card-front, .card:nth-child(8n+5) .card-front{ --brick-color: var(--lego-blue); --brick-color-dark: var(--lego-blue-dark); }
  .card:nth-child(8n+4) .card-front, .card:nth-child(8n+7) .card-front{ --brick-color: var(--lego-green); --brick-color-dark: var(--lego-green-dark); }

  .card-back{
    background: var(--paper);
    transform: rotateY(180deg);
    padding: 4px;
    box-shadow: inset 0 0 0 4px var(--white);
  }
  .card.matched .card-back{
    background: #e2f7ea;
    border-color: var(--lego-green);
    box-shadow: inset 0 0 0 4px #f2fbf6;
  }
  .emoji{ font-size: clamp(1.6rem, 44cqw, 3.6rem); }
  .item-photo{
    width: 88%;
    height: 88%;
    object-fit: contain;
    border-radius: 6px;
    /* 原圖物品偏小、留白多，放大後由卡片 overflow:hidden 裁掉留白 */
    transform: scale(1.35);
  }
  .text-content{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2cqw;
    width: 100%;
    height: 100%;
    line-height: 1.15;
  }
  .hanzi{
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    color: var(--ink);
    font-size: clamp(0.95rem, 24cqw, 2.1rem);
    white-space: nowrap;
  }
  .hanzi.len3{ font-size: clamp(0.85rem, 22cqw, 1.9rem); }
  .phon{
    color: var(--lego-red);
    font-family: 'Noto Sans TC', 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(0.55rem, 12cqw, 1.05rem);
    max-width: 100%;
    word-break: keep-all;
  }
  .phon.long{ font-size: clamp(0.5rem, 9.5cqw, 0.9rem); }
  .phon:empty{ display:none; }

  /* ================= 分數 / 排行榜 ================= */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(20,20,25,0.6);
    display:none;
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    padding: 28px 22px;
    box-shadow: 0 10px 0 var(--ink), 0 18px 34px rgba(0,0,0,0.3);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
  }
  .modal-box h2{ color: var(--lego-red); font-size: 1.3rem; margin-bottom: 6px; }
  .score-big{
    font-size: 2.8rem;
    color: var(--ink);
    background: var(--lego-yellow);
    border: 3px solid var(--ink);
    border-radius: 14px;
    display: inline-block;
    padding: 4px 22px;
    margin: 12px 0 6px;
    font-weight: 900;
    box-shadow: 0 5px 0 var(--lego-yellow-dark);
  }
  .score-detail{ font-size: 0.85rem; font-weight: 600; color: #5a5a5a; margin: 12px 0 18px; }
  .leaderboard-list{
    list-style: none;
    padding: 0; margin: 14px 0 0;
    max-height: 300px;
    overflow-y: auto;
    text-align: left;
  }
  .leaderboard-list li{
    display:flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 10px;
    border-bottom: 2px dashed #cfd3d9;
    font-size: 0.92rem;
  }
  .leaderboard-list .row-top{ display:flex; align-items:center; gap: 10px; }
  .leaderboard-list .row-meta{ font-size: 0.74rem; color: #8a8a8a; padding-left: 32px; }
  .leaderboard-list .rank{ font-weight:900; color: var(--lego-red); width: 22px; }
  .leaderboard-list .lname{ flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .leaderboard-list .lscore{ color: var(--lego-green-dark); font-weight:800; }
  .script-tag{
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    border: 1.5px solid #9a9a9a;
    border-radius: 4px;
    padding: 0 4px;
    color: #6a6a6a;
  }
  .modal-btn-row{ display:flex; gap:10px; justify-content:center; margin-top: 20px; flex-wrap: wrap; }
  .loading-text{ font-size: 0.85rem; font-weight: 600; color:#8a8a8a; padding: 10px 0; }

  /* ================= 跑馬燈提示 ================= */
  .marquee-banner{
    position: fixed;
    top: 50%; left: 0;
    width: 100%;
    transform: translateY(-50%);
    z-index: 40;
    pointer-events: none;
    overflow: hidden;
    background: repeating-linear-gradient(135deg, var(--lego-yellow) 0 22px, var(--ink) 22px 26px);
    border-top: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    padding: 14px 0;
    display: none;
  }
  .marquee-banner.show{ display: block; }
  .marquee-banner .marquee-text{
    display: inline-block;
    white-space: nowrap;
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 900;
    color: var(--white);
    -webkit-text-stroke: 1.5px var(--ink);

} catch(e){}

function saveSettings(){
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e){}

function t(key){ return UI[settings.lang][key]; }
function hanzi(item){ return settings.script === 'trad' ? item.trad : item.simp; }
function phonetic(item){
  if (settings.phon === 'pinyin') return item.pinyin;
  if (settings.phon === 'zhuyin') return item.zhuyin;
  return '';

function meaning(item){ return item[settings.lang]; }

];

function renderSettings(){
  document.querySelectorAll('[data-settings]').forEach(container => {
    container.innerHTML = '';
    SETTING_DEFS.forEach(def => {
      const group = document.createElement('div');
      group.className = 'setting-group';
      const label = document.createElement('div');
      label.className = 'setting-label';
      label.textContent = t(def.label);
      const seg = document.createElement('div');
      seg.className = 'seg';
      def.options.forEach(([value, text]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = text();
        if (settings[def.key] === value) b.classList.add('active');
        b.addEventListener('click', () => changeSetting(def.key, value));
        seg.appendChild(b);
      });
      group.append(label, seg);
      container.appendChild(group);
    });
  });
}

function changeSetting(key, value){
  if (settings[key] === value) return;
  settings[key] = value;
  saveSettings();
  applyAll();
}

/* 把目前設定套用到整個畫面（立刻生效） */
function applyAll(){
  document.documentElement.lang = settings.lang;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t(el.dataset.i18n);
    if (typeof val === 'string') el.textContent = val;
  });
  playerNameInput.placeholder = t('namePh');
  if (nameError.textContent) nameError.textContent = t('nameErr');
  renderSettings();
  refreshCardTexts();
  renderLog();
  if (scoreModal.classList.contains('show')) renderScoreModal();
  if (leaderboardModal.classList.contains('show')) loadLeaderboard();
}

/* =========================================================
   遊戲狀態
   ========================================================= */
const PAIR_COUNT = 18;
const FLIP_DURATION = 500;        // 與 CSS .card-inner 的翻轉時間一致
const MISMATCH_VIEW_TIME = 1100;  // 配錯時，翻開後再停留的時間（玩家也可以直接點下一張）

let playerName = '';
let gameId = 0;                   // 每局一個編號，上一局留下的延遲動作一律忽略
let flippedCards = [];
let pendingMismatch = null;       // { a, b, timeoutId }
let matchedPairs = 0;
let moves = 0;
let timer = 0;
let timerInterval = null;
let isPlaying = false;
let marqueeStage = 0;
let logEntries = [];              // { kind: 'flip'|'match', id, cardType }
let lastResult = null;            // 最近一局的結果（給分數視窗切換語言用）

const $ = id => document.getElementById(id);
const nameScreen = $('name-screen');
const gameScreen = $('game-screen');
const playerNameInput = $('player-name');
const nameError = $('name-error');
const board = $('game-board');
const scoreModal = $('score-modal');
const leaderboardModal = $('leaderboard-modal');
const leaderboardList = $('leaderboard-list');
const leaderboardLoading = $('leaderboard-loading');
const logList = $('log-list');
const lastFlipEl = $('last-flip');
const marqueeBanner = $('marquee-banner');
const marqueeText = $('marquee-text');
const sidebar = $('sidebar');
const logCol = $('log-col');

$('pairs-total').textContent = PAIR_COUNT;

/* ---------- 圖片：先試 webp，再試 png，都沒有就顯示 emoji ---------- */
function imageSources(id){ return [`images/images${id}.webp`, `images/images${id}.png`]; }

function preloadImages(){
  vocab.forEach(v => {
    const img = new Image();
    img.src = imageSources(v.id)[0];
  });
}

/* ---------- 姓名輸入 ---------- */
$('confirm-name-btn').addEventListener('click', submitName);
playerNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });

function submitName(){
  const val = playerNameInput.value.trim();
  if (!val){
    nameError.textContent = t('nameErr');
    return;
  }
  playerName = val.slice(0, 14);
  $('player-name-display').textContent = playerName;
  nameError.textContent = '';
  nameScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  document.body.classList.add('in-game');
  startGame();
}

/* ---------- 窄螢幕的「設定」與「紀錄」展開 ---------- */
$('settings-toggle-btn').addEventListener('click', () => sidebar.classList.toggle('open'));
$('log-title').addEventListener('click', () => logCol.classList.toggle('open'));

/* ---------- 遊戲紀錄 ---------- */
function logLine(entry){
  const item = vocabById[entry.id];
  const p = phonetic(item);
  const zh = `<span class="zh"></span>`;
  const li = document.createElement('li');
  if (entry.kind === 'match'){
    li.classList.add('log-success');
    li.innerHTML = `${escapeHtml(t('match'))} ${zh}`;
    li.querySelector('.zh').textContent = hanzi(item) + (p ? ` · ${p}` : '');
  } else {
    const type = entry.cardType === 'img' ? t('flipImg') : t('flipText');
    li.innerHTML = `${escapeHtml(type)}: ${zh} · ${escapeHtml(meaning(item))}`;
    li.querySelector('.zh').textContent = hanzi(item) + (p ? ` · ${p}` : '');
  }
  return li;
}

function renderLog(){
  logList.innerHTML = '';
  if (!logEntries.length){
    const li = document.createElement('li');
    li.className = 'log-empty';
    li.textContent = t('logEmpty');
    logList.appendChild(li);
    lastFlipEl.innerHTML = '';
    return;
  }
  for (let i = logEntries.length - 1; i >= 0; i--) logList.appendChild(logLine(logEntries[i]));
  const latest = logLine(logEntries[logEntries.length - 1]);
  lastFlipEl.innerHTML = latest.innerHTML;
}

function addLog(entry){
  logEntries.push(entry);
  renderLog();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ---------- 跑馬燈：只跑一次就消失 ---------- */
function showMarquee(text){
  marqueeBanner.classList.remove('show');
  void marqueeBanner.offsetWidth;
  marqueeText.textContent = text;
  marqueeBanner.classList.add('show');
}
function hideMarquee(){
  marqueeBanner.classList.remove('show');
  marqueeText.textContent = '';
}
marqueeText.addEventListener('animationend', hideMarquee);

function checkMarqueeThresholds(){
  if (!isPlaying) return;
  if (marqueeStage < 2 && (timer >= 180 || moves > 120)){
    marqueeStage = 2;
    showMarquee(t('marquee2'));
  } else if (marqueeStage < 1 && (timer >= 120 || moves > 80)){
    marqueeStage = 1;
    showMarquee(t('marquee1'));
  }
}

function shuffle(array){
  for (let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

/* ---------- 牌上的文字（換字體／發音標示時重畫） ---------- */
function fillTextCard(cardEl){
  const item = vocabById[cardEl.dataset.id];
  const hz = cardEl.querySelector('.hanzi');
  const ph = cardEl.querySelector('.phon');
  const word = hanzi(item);
  hz.textContent = word;
  hz.classList.toggle('len3', word.length >= 3);
  const p = phonetic(item);
  ph.textContent = p;
  ph.classList.toggle('long', p.length > 9);
}

function refreshCardTexts(){
  board.querySelectorAll('.card[data-type="text"]').forEach(fillTextCard);
  board.querySelectorAll('.item-photo').forEach(img => { img.alt = hanzi(vocabById[img.closest('.card').dataset.id]); });
}

/* ---------- 開始遊戲 ---------- */
function startGame(){
  gameId++;
  clearInterval(timerInterval);
  if (pendingMismatch) clearTimeout(pendingMismatch.timeoutId);
  pendingMismatch = null;
  flippedCards = [];
  timer = 0;
  moves = 0;
  matchedPairs = 0;
  isPlaying = true;
  marqueeStage = 0;
  logEntries = [];
  lastResult = null;
  $('timer').textContent = 0;
  $('moves').textContent = 0;
  $('pairs-found').textContent = 0;
  hideMarquee();
  renderLog();
  sidebar.classList.remove('open');

  const chosen = shuffle([...vocab]).slice(0, PAIR_COUNT);
  const cards = [];
  chosen.forEach(item => {
    cards.push({ id: item.id, type: 'img' });
    cards.push({ id: item.id, type: 'text' });
  });
  shuffle(cards);

  board.innerHTML = '';
  cards.forEach(card => {
    const item = vocabById[card.id];
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.id = card.id;
    cardEl.dataset.type = card.type;
    cardEl.innerHTML = `<div class="card-inner"><div class="card-front"></div><div class="card-back"></div></div>`;
    const back = cardEl.querySelector('.card-back');

    if (card.type === 'img'){
      const img = document.createElement('img');
      img.className = 'item-photo';
      img.alt = hanzi(item);
      const sources = imageSources(card.id);
      let idx = 0;
      img.addEventListener('error', () => {
        idx++;
        if (idx < sources.length){
          img.src = sources[idx];
        } else {
          const emojiDiv = document.createElement('div');
          emojiDiv.className = 'emoji';
          emojiDiv.textContent = item.emoji;
          img.replaceWith(emojiDiv);
        }
      });
      img.src = sources[0];
      back.appendChild(img);
    } else {
      back.innerHTML = `<div class="text-content"><div class="hanzi"></div><div class="phon"></div></div>`;
      fillTextCard(cardEl);
    }

    cardEl.addEventListener('click', () => flipCard(cardEl));
    board.appendChild(cardEl);
  });

  const thisGame = gameId;
  timerInterval = setInterval(() => {
    if (thisGame !== gameId) return;
    timer++;
    $('timer').textContent = timer;
    checkMarqueeThresholds();
  }, 1000);

  trackEvent('game_start', { script: settings.script, lang: settings.lang, phon: settings.phon });
}

/* ---------- 翻牌 ---------- */
function flipCard(cardEl){
  if (!isPlaying) return;

  // 上一組配錯的牌還開著：玩家點任何一張牌，就立刻把那兩張蓋回去
  if (pendingMismatch){
    const wasOneOfThem = cardEl === pendingMismatch.a || cardEl === pendingMismatch.b;
    coverMismatch();
    if (wasOneOfThem) return;
  }

  if (flippedCards.length >= 2) return;
  if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

  cardEl.classList.add('flipped');
  flippedCards.push(cardEl);

  const item = vocabById[cardEl.dataset.id];
  speakText(item.trad);
  addLog({ kind: 'flip', id: item.id, cardType: cardEl.dataset.type });

  if (flippedCards.length === 2){
    moves++;
    $('moves').textContent = moves;
    checkMarqueeThresholds();
    checkForMatch();
  }
}

function coverMismatch(){
  if (!pendingMismatch) return;
  const { a, b, timeoutId } = pendingMismatch;
  clearTimeout(timeoutId);
  a.classList.remove('flipped');
  b.classList.remove('flipped');
  pendingMismatch = null;
}

function checkForMatch(){
  const [cardA, cardB] = flippedCards;
  flippedCards = [];
  const thisGame = gameId;

  if (cardA.dataset.id === cardB.dataset.id){
    cardA.classList.add('matched');
    cardB.classList.add('matched');
    setTimeout(() => {
      if (thisGame !== gameId) return;
      triggerFirework(cardA);
      triggerFirework(cardB);
    }, FLIP_DURATION);

    matchedPairs++;
    $('pairs-found').textContent = matchedPairs;
    addLog({ kind: 'match', id: +cardA.dataset.id });

    if (matchedPairs === PAIR_COUNT){
      clearInterval(timerInterval);
      isPlaying = false;
      setTimeout(() => { if (thisGame === gameId) finishGame(); }, FLIP_DURATION + 500);
    }
  } else {
    // 配錯：翻面動畫結束後抖一下，停留一段時間再蓋回；期間玩家點下一張會立刻蓋回
    const shakeId = setTimeout(() => {
      if (thisGame !== gameId) return;
      if (!pendingMismatch || pendingMismatch.a !== cardA) return;
      [cardA, cardB].forEach(c => {
        c.classList.remove('shake');
        void c.offsetWidth;
        c.classList.add('shake');
      });
    }, FLIP_DURATION);
    const timeoutId = setTimeout(() => {
      if (thisGame !== gameId) return;
      coverMismatch();
    }, FLIP_DURATION + MISMATCH_VIEW_TIME);
    pendingMismatch = { a: cardA, b: cardB, timeoutId, shakeId };
  }
}

board.addEventListener('animationend', e => {
  if (e.animationName === 'shakeCard') e.target.classList.remove('shake');
});

/* ---------- 配對成功的煙火 ---------- */
function triggerFirework(cardEl){
  const container = document.createElement('div');
  container.className = 'firework';
  const colors = ['#FFD500', '#D6180E', '#00A650', '#0060B0'];
  const count = 10;
  for (let i = 0; i < count; i++){
    const dot = document.createElement('span');
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const distance = 26 + Math.random() * 20;
    dot.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
    dot.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
    dot.style.background = colors[i % colors.length];
    container.appendChild(dot);
  }
  cardEl.appendChild(container);
  setTimeout(() => container.remove(), 800);
}

/* =========================================================
   語音：一律念台灣讀音；沒有中文語音時顯示提示
   ========================================================= */
let zhVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => /zh[-_]TW/i.test(v.lang))
         || voices.find(v => /^zh/i.test(v.lang) || /cmn/i.test(v.lang))
         || null;
  if (zhVoice) $('voice-hint').classList.remove('show');
}
let voiceHintDismissed = false;
$('voice-hint-close').addEventListener('click', () => {
  voiceHintDismissed = true;
  $('voice-hint').classList.remove('show');
});
function checkVoiceAvailable(){
  if (!('speechSynthesis' in window)){
    if (!voiceHintDismissed) $('voice-hint').classList.add('show');
    return;
  }
  pickVoice();
  speechSynthesis.addEventListener('voiceschanged', pickVoice);
  // 有些裝置語音清單會晚一點才載入，等一下再判斷
  setTimeout(() => {
    pickVoice();
    if (!zhVoice && !voiceHintDismissed) $('voice-hint').classList.add('show');
  }, 2000);
}

function speakText(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  if (zhVoice) u.voice = zhVoice;
  u.rate = 0.75; // 0.1（很慢）～ 10（很快），1 是正常
  speechSynthesis.speak(u);
}

/* =========================================================
   計分
   總分 = 準確度（最多 700）＋ 速度獎勵（最多 300）
   準確度 = 18 ÷ 實際次數 × 700；速度獎勵 = 300 − 秒數（最少 0）
   ========================================================= */
function calculateScore(pairs, movesUsed, seconds){
  const accuracyScore = (pairs / movesUsed) * 700;
  const timeBonus = Math.max(0, 300 - seconds);
  return Math.round(accuracyScore + timeBonus);
}

function finishGame(){
  hideMarquee();
  const score = calculateScore(matchedPairs, moves, timer);
  lastResult = { score, moves, timeSeconds: timer, status: 'saving' };
  renderScoreModal();
  scoreModal.classList.add('show');

  trackEvent('game_complete', {
    score, moves, time_seconds: timer,
    script: settings.script, lang: settings.lang, phon: settings.phon
  });

  const record = {
    name: playerName,
    score,
    moves,
    timeSeconds: timer,
    script: settings.script,
    lang: settings.lang
  };
  saveScore(record).then(ok => {
    if (!lastResult || lastResult.score !== score) return;
    lastResult.status = ok ? 'saved' : 'queued';
    renderScoreModal();
  });
}

function renderScoreModal(){
  if (!lastResult) return;
  $('final-score').textContent = lastResult.score;
  $('score-breakdown').textContent = t('breakdown')(lastResult.timeSeconds, lastResult.moves);
  $('save-status').textContent = t(lastResult.status);
}

/* =========================================================
   排行榜存檔：失敗就先存在玩家瀏覽器，之後自動補送
   ========================================================= */
const QUEUE_KEY = 'memorama_pending_scores';
function readQueue(){
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch(e){ return []; }
}
function writeQueue(q){
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch(e){}
}

async function sendScore(record){
  if (!db) return false;
  const signedIn = await authReady;
  if (!signedIn) return false;
  try {
    await db.collection(LEADERBOARD_COLLECTION).add({
      ...record,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  } catch(err){
    console.error('Save score failed:', err);
    return false;
  }
}

async function saveScore(record){
  const ok = await sendScore(record);
  if (!ok){
    const q = readQueue();
    q.push(record);
    writeQueue(q.slice(-20));
  }
  return ok;
}

let flushing = false;
async function flushQueue(){
  if (flushing) return;
  const q = readQueue();
  if (!q.length) return;
  flushing = true;
  const remaining = [];
  for (const record of q){
    if (!(await sendScore(record))) remaining.push(record);
  }
  writeQueue(remaining);
  flushing = false;
}
window.addEventListener('online', flushQueue);

/* ---------- 讀取排行榜 ---------- */
let leaderboardRequest = 0;
function loadLeaderboard(){
  const req = ++leaderboardRequest;
  leaderboardLoading.style.display = 'block';
  leaderboardLoading.textContent = t('loading');
  leaderboardList.innerHTML = '';

  if (!db){
    leaderboardLoading.textContent = t('lbFail');
    return;
  }

  db.collection(LEADERBOARD_COLLECTION)
    .orderBy('score', 'desc')
    .limit(10)
    .get()
    .then(snapshot => {
      if (req !== leaderboardRequest) return;
      leaderboardLoading.style.display = 'none';
      if (snapshot.empty){
        const li = document.createElement('li');
        li.textContent = t('lbEmpty');
        leaderboardList.appendChild(li);
        return;
      }
      let rank = 1;
      snapshot.forEach(doc => {
        const d = doc.data();
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="row-top">
            <span class="rank"></span>
            <span class="lname"></span>
            <span class="lscore"></span>
          </div>
          <div class="row-meta"></div>`;
        // 名字一律當純文字放進去，避免有人在名字裡塞網頁碼
        li.querySelector('.rank').textContent = rank;
        li.querySelector('.lname').textContent = String(d.name ?? '');
        li.querySelector('.lscore').textContent = `${Number(d.score) || 0} pts`;
        const meta = li.querySelector('.row-meta');
        meta.textContent = `⏱️ ${d.timeSeconds ?? '—'} ${t('sec')} · 🔄 ${d.moves ?? '—'} ${t('tries')} `;
        if (d.script === 'simp' || d.script === 'trad'){
          const tag = document.createElement('span');
          tag.className = 'script-tag';
          tag.textContent = d.script === 'trad' ? '繁' : '简';
          meta.appendChild(tag);
        }
        leaderboardList.appendChild(li);
        rank++;
      });
    })
    .catch(err => {
      if (req !== leaderboardRequest) return;
      console.error(err);
      leaderboardLoading.textContent = t('lbFail');
    });
}

function openLeaderboard(){
  leaderboardModal.classList.add('show');
  loadLeaderboard();
  trackEvent('leaderboard_view');
}

/* ---------- 按鈕 ---------- */
$('start-btn').addEventListener('click', startGame);
$('play-again-btn').addEventListener('click', () => {
  scoreModal.classList.remove('show');
  startGame();
});
$('show-leaderboard-from-score-btn').addEventListener('click', () => {
  scoreModal.classList.remove('show');
  openLeaderboard();
});
$('view-leaderboard-btn').addEventListener('click', openLeaderboard);
$('close-leaderboard-btn').addEventListener('click', () => leaderboardModal.classList.remove('show'));

/* ---------- 開啟頁面時 ---------- */
applyAll();
preloadImages();
checkVoiceAvailable();
flushQueue();
</script>
