<h1>Memorama 捲動測試</h1><div class="sub">用手機 Chrome 開，每個連結都做下面五件事，記下有沒有問題</div>
<a class="t" href="../index.html"><b>現在的（對照）</b><span>目前網站上的版本</span></a>
<a class="t" href="a.html"><b>A　只讓內容區滑動</b><span>網頁本身不動，只有裡面自己滑</span></a>
<a class="t" href="b.html"><b>B　回到頂端按鈕</b><span>往下滑後右下角出現 ↑ 按鈕</span></a>
<a class="t" href="c.html"><b>C　上方固定列</b><span>進遊戲後，上方固定重新開始／排行榜／離開</span></a>
<h1 style="margin-top:22px">每個連結都做這五件事</h1><ol>
<li>開始頁往下滑到底，再往上滑回最上面</li><li>按進入遊戲，看上方時間、次數、按鈕有沒有被切掉</li>
<li>遊戲中往下滑再往上滑，最上面回不回得去</li><li>按重新開始，再看一次上方有沒有被切掉</li>
<li>網址列縮起來又展開時，畫面有沒有跳動</li></ol></body></html>
